kind = "web"
previewPath = "/"
title = "RK Industries"
description = "A modern glossy product showcase website for RK Industries, a Delhi-based supplier of industrial chemicals and specialty materials. Includes home, about, products, clients, and contact experiences."
version = "1.0.0"
id = "artifacts/rr-enterprises-redesign"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20664

[services.development]
run = "pnpm --filter @workspace/rr-enterprises-redesign run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rr-enterprises-redesign", "run", "build" ]
serve = "static"
publicDir = "artifacts/rr-enterprises-redesign/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20664"
BASE_PATH = "/"
